<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Team story page for the team-lead skill. Fill it by replacing the title and
   data placeholders (see SKILL.md §5). A "ticket" of numbers, the crew,
   then chapters of narrative with real quotes and screenshots. Retheme the
   tokens to the project's world if it has one. */
:root {
  --bg: #e9ede6; --surface: #f7f8f4; --ink: #1d2520; --muted: #5a675f; --line: #d2d9cf;
  --accent: #9a6b14; --band: #1f5a43; --band-ink: #f1e6c8;
  --c1: #9a6b14; --c2: #7a3e9d; --c3: #2f5fa8; --c4: #b5452b; --c5: #2e7d5b; --c6: #4f5566;
  --c7: #a13e6b; --c8: #6b5a1e; --c9: #b02a37; --c10: #0f7c86; --c11: #6d6d6d; --c12: #3d6b1e;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1411; --surface: #141d19; --ink: #e5e9e1; --muted: #93a198; --line: #27342d;
  --accent: #d8ad55; --band: #1b4a37; --band-ink: #f1e2bb;
  --c1: #e0b35a; --c2: #c9a0e6; --c3: #8db3f0; --c4: #f0937a; --c5: #7dd3a8; --c6: #b7bccb;
  --c7: #ee95bd; --c8: #d2c07a; --c9: #ff8a95; --c10: #74d6df; --c11: #a9a9a9; --c12: #a6d878; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1411; --surface: #141d19; --ink: #e5e9e1; --muted: #93a198; --line: #27342d;
  --accent: #d8ad55; --band: #1b4a37; --band-ink: #f1e2bb;
  --c1: #e0b35a; --c2: #c9a0e6; --c3: #8db3f0; --c4: #f0937a; --c5: #7dd3a8; --c6: #b7bccb;
  --c7: #ee95bd; --c8: #d2c07a; --c9: #ff8a95; --c10: #74d6df; --c11: #a9a9a9; --c12: #a6d878; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 56px; }
a { color: var(--accent); }
code { font-family: var(--mono); font-size: 0.85em; background: color-mix(in srgb, var(--line) 55%, transparent); padding: 0.05em 0.3em; border-radius: 4px; overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 6vw, 56px); line-height: 0.95; margin: 6px 0 10px; text-wrap: balance; }
.lede { max-width: 68ch; margin: 0 0 16px; color: var(--muted); }
.ticket { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); border: 1px dashed var(--accent); border-radius: 10px; background: var(--surface); margin-bottom: 26px; }
.ticket div { padding: 10px 14px; border-right: 1px dashed var(--line); min-width: 0; }
.ticket div:last-child { border-right: 0; }
.ticket b { display: block; font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.ticket span { font-size: 12px; color: var(--muted); }
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 36px; align-items: start; }
@media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.crew { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.crew h2 { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: 0.03em; text-transform: uppercase; margin: 0 0 8px; }
.crew ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.crew li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 13px; color: var(--bg); background: var(--who); }
.crew .name { font-weight: 700; color: var(--who); line-height: 1.2; }
.crew .role { font-size: 12px; color: var(--muted); line-height: 1.35; }
@media (max-width: 820px) { .crew { position: static; } .crew ul { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }
.story { display: grid; gap: 30px; max-width: 70ch; min-width: 0; }
.story h3 { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: 0.02em; margin: 0 0 8px; text-wrap: balance; }
.story h3 small { display: block; font-family: var(--mono); font-weight: 400; font-size: 12px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
.story p { margin: 0 0 10px; }
.story blockquote { margin: 14px 0; padding: 4px 0 4px 16px; border-left: 3px solid var(--who); font-size: 18px; }
.story blockquote cite { display: block; font-style: normal; font-size: 13px; color: var(--who); font-weight: 700; margin-top: 2px; }
.story figure { margin: 14px 0; }
.story figure button { padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: none; cursor: zoom-in; display: block; width: 100%; }
.story figure img { display: block; width: 100%; height: auto; }
.story figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }
.source { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); max-width: 80ch; }
dialog { border: 0; padding: 0; background: transparent; max-width: min(1200px, 94vw); }
dialog::backdrop { background: rgb(0 0 0 / 0.78); }
dialog img { display: block; max-width: 100%; max-height: 82vh; border-radius: 8px; }
dialog p { color: #eee; font-size: 14px; margin: 8px 0 0; }
dialog button { position: absolute; top: 8px; right: 8px; font: 700 14px var(--body); background: rgb(0 0 0 / 0.6); color: #fff; border: 1px solid rgb(255 255 255 / 0.4); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
</style>

<div class="wrap">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>
  <div class="ticket" id="ticket"></div>
  <div class="layout">
    <aside class="crew"><h2>Crew</h2><ul id="crew"></ul></aside>
    <main>
      <div class="story" id="story"></div>
      <p class="source" id="source"></p>
    </main>
  </div>
</div>
<dialog id="lightbox"><button type="button" id="lightbox-close">Close</button><img id="lightbox-img" alt=""><p id="lightbox-cap"></p></dialog>

<script>
/* DATA shape:
   { eyebrow, title, lede, source,
     ticket: [["3 h 35 min", "first night, kickoff to ship"], ...],   // value, label; value may hold a link as {"text","href"}
     crew: [{ name, role, model }],                                     // colors follow this order (c1..c12)
     chapters: [{ when, title, blocks: [ {p: "text"} | {quote: "verbatim text", by: "Name"} | {img: "img/file.jpg", caption: "…"} ] }] }
   Text may use `backticks` for code and @Name for a crew mention. Quotes must be verbatim. */
const D = __DATA__;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const colorOf = Object.fromEntries(D.crew.map((m, i) => [m.name, `var(--c${(i % 12) + 1})`]));
const who = (n) => colorOf[n] || "var(--muted)";
const initials = (n) => n.replace(/[^A-Za-z ]/g, "").split(/\s+/).filter(Boolean).map((w) => w[0]).join("").slice(0, 2).toUpperCase() || n.slice(0, 2).toUpperCase();
const fmt = (t) => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/@(\w+)/g, (m, n) => colorOf[n] ? `<b style="color:${who(n)}">@${n}</b>` : m);

document.getElementById("eyebrow").textContent = D.eyebrow || "";
document.getElementById("title").textContent = D.title;
document.getElementById("lede").innerHTML = fmt(D.lede || "");
document.getElementById("source").innerHTML = fmt(D.source || "");
document.getElementById("ticket").innerHTML = D.ticket.map(([v, l]) =>
  `<div><b>${typeof v === "object" ? `<a href="${esc(v.href)}">${esc(v.text)}</a>` : esc(v)}</b><span>${esc(l)}</span></div>`).join("");
document.getElementById("crew").innerHTML = D.crew.map((m) =>
  `<li style="--who:${who(m.name)}"><span class="avatar" aria-hidden="true">${initials(m.name)}</span><span><span class="name">${esc(m.name)}</span><br><span class="role">${esc(m.role)} · ${esc(m.model)}</span></span></li>`).join("");
const block = (b) => b.quote ? `<blockquote style="--who:${who(b.by)}">${fmt(b.quote)}<cite>${esc(b.by)}</cite></blockquote>`
  : b.img ? `<figure><button type="button" data-img="${esc(b.img)}" data-cap="${esc(b.caption || "")}" aria-label="Enlarge"><img loading="lazy" src="${esc(b.img)}" alt="${esc(b.caption || "Screenshot")}"></button><figcaption>${fmt(b.caption || "")}</figcaption></figure>`
  : `<p>${fmt(b.p)}</p>`;
document.getElementById("story").innerHTML = D.chapters.map((c) =>
  `<article><h3><small>${esc(c.when)}</small>${esc(c.title)}</h3>${c.blocks.map(block).join("")}</article>`).join("");

const box = document.getElementById("lightbox");
document.addEventListener("click", (e) => {
  const f = e.target.closest("[data-img]");
  if (!f) return;
  document.getElementById("lightbox-img").src = f.dataset.img;
  document.getElementById("lightbox-cap").textContent = f.dataset.cap;
  box.showModal();
});
document.getElementById("lightbox-close").addEventListener("click", () => box.close());
box.addEventListener("click", (e) => { if (e.target === box) box.close(); });
</script>
