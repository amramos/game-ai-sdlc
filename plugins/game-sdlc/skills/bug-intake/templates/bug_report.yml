name: Bug report
description: Something in the game doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, as plainly as you can.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps from starting the game. Numbered, please.
      placeholder: |
        1. Start a new game
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Build version
      description: Shown on the title screen, or the itch.io build you downloaded.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Linux, Web, Other]
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots, logs or save files
      description: Drag files here if you have them.
